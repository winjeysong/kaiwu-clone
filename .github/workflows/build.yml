name: 构建桌面客户端

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    env:
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      BUZZ_FORK_IMAGE: crpi-fz0dnre7t4yztz62.cn-shanghai.personal.cr.aliyuncs.com/${{ secrets.ACR_NAMESPACE }}/buzz-fork-hermes:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis

    steps:
      - name: 检查运行时镜像配置
        shell: bash
        run: test -n "$ACR_NAMESPACE"

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: 测试 Rust 工作区
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

      - name: 构建安装包
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Kaiwu Clone v__VERSION__
          releaseBody: Windows 与 macOS 安装包。
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
