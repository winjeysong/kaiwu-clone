stages:
  - publish

default:
  tags:
    - docker
    - acr
    - agent
  interruptible: true

variables:
  ACR_REGISTRY: crpi-fz0dnre7t4yztz62.cn-shanghai.personal.cr.aliyuncs.com
  DOCKER_VERSION: "29.6.1"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_DRIVER: "overlay2"
  DOCKER_BUILDKIT: "1"
  DOCKER_PLATFORM: "linux/amd64"
  GIT_DEPTH: "0"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

publish-runtime-image:
  stage: publish
  image: "docker:${DOCKER_VERSION}-cli"
  services:
    - name: "docker:${DOCKER_VERSION}-dind"
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  resource_group: buzz-fork-hermes
  before_script:
    - apk add --no-cache git
    - git fetch origin "+${CI_DEFAULT_BRANCH}:refs/remotes/origin/${CI_DEFAULT_BRANCH}"
    - |
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" "refs/remotes/origin/${CI_DEFAULT_BRANCH}"; then
        echo "Tag ${CI_COMMIT_TAG} 不属于 ${CI_DEFAULT_BRANCH} 分支历史，拒绝构建" >&2
        exit 1
      fi
    - test -n "$ACR_USERNAME"
    - test -n "$ACR_PASSWORD"
    - test -n "$ACR_NAMESPACE"
    - docker info
    - docker version
    - printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
  script:
    - export IMAGE="$ACR_REGISTRY/$ACR_NAMESPACE/buzz-fork-hermes"
    - docker build --pull --platform "$DOCKER_PLATFORM" --tag "$IMAGE:$CI_COMMIT_SHA" --tag "$IMAGE:latest" runtime
    - docker push "$IMAGE:$CI_COMMIT_SHA"
    - docker push "$IMAGE:latest"
  after_script:
    - docker logout "$ACR_REGISTRY" || true
